name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Unzip project code
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" || true; done

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Android App
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            cd $(dirname "$GRADLE_PATH")
            chmod +x gradlew
            ./gradlew assembleDebug --continue
          else
            pnpm --recursive exec expo prebuild --platform android || true
            pnpm --recursive exec expo run:android --variant debug || pnpm run build
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-debug-apk
          path: |
            **/*.apk
