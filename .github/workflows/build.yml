name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Unzip project code
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" || true; done

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch Android SDK Version & Build
        run: |
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            ROOT_DIR=$(dirname "$GRADLE_PATH")
            echo "Found Android root at $ROOT_DIR"
            
            # رفع compileSdkVersion و targetSdkVersion إلى 34 تلقائياً لحل تعارض مكتبات androidx
            find "$ROOT_DIR" -name "build.gradle" -exec sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' {} +
            find "$ROOT_DIR" -name "build.gradle" -exec sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' {} +
            find "$ROOT_DIR" -name "build.gradle" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
            find "$ROOT_DIR" -name "build.gradle" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +

            cd "$ROOT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx4g" --continue -x test -x lint
          else
            pnpm --recursive exec expo prebuild --platform android || true
            pnpm --recursive exec expo run:android --variant debug || pnpm run build
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-debug-apk
          path: |
            **/*.apk
