name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Unzip project code
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" || true; done

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Android App
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \;)
          if [ -n "$ANDROID_DIR" ]; then
            echo "Found Android directory at: $ANDROID_DIR"
            cd "$ANDROID_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No gradlew found, building via React Native / Expo"
            pnpm exec expo prebuild --platform android || true
            pnpm exec react-native build-android --mode=debug || pnpm exec expo run:android --variant debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
